services:
  astrolabed-dns:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrolabed-dns-dev
    hostname: astrolabed-dns-dev
    restart: unless-stopped
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"

    environment:
      - Logging__LogLevel__Default=Debug
      - DnsEngine__ListenAddress__Address=0.0.0.0
      - DnsEngine__ListenAddress__Port=53
      - DnsEngine__ProcessingThreads=2

    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      - ../netdns-runtime/:/etc/astrolabed/:ro

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
