site_name: Astrolabed Documentation
site_description: Documentation for the Astrolabed project (usage, technical details, configuration, and diagrams).
site_url: https://guidcruncher.github.io/astrolabed
repo_name: guidcruncher/astrolabed
repo_url: https://github.com/guidcruncher/astrolabed

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    primary: indigo
    accent: teal
  features:
    - navigation.instant

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Usage: usage.md
  - Technical: technical.md
  - Examples: examples.md
  - Configuration examples: configurations.md
  - Configuration documentation: configurationdocs.md
  - Architecture: architecture.md
  - Diagrams:
      - Diagrams index: diagrams/README.md
      - Component diagram: diagrams/architect.md
      - DNS sequence: diagrams/dns.md
      - DHCP sequence: diagrams/dhcp.md
      - NTP sequence: diagrams/ntp.md
  - Public DNS: public-dns.json
  - Docker Compose: docker-compose.md
  - Prometheus config: prometheus.md

extra_css:
  - assets/custom.css
