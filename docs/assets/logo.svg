<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: auto; max-width: 100%;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Brass / Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#0575e6" />
    </linearGradient>

    <!-- Glowing Blue Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="850" rx="24" fill="url(#bgGrad)" />

  <!-- Constellation Grid Background Overlay -->
  <g opacity="0.15" stroke="#00f2fe" stroke-width="1" fill="none">
    <circle cx="400" cy="380" r="340" stroke-dasharray="4 8" />
    <circle cx="400" cy="380" r="290" stroke-dasharray="2 12" />
    <line x1="60" y1="380" x2="740" y2="380" />
    <line x1="400" y1="40" x2="400" y2="720" />
    <line x1="160" y1="140" x2="640" y2="620" />
    <line x1="160" y1="620" x2="640" y2="140" />
  </g>

  <!-- Astrolabe Top Ring (Throne) -->
  <g transform="translate(400, 70)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#111827" stroke-width="3" />
    <path d="M -40 45 C -20 20, 20 20, 40 45 L 25 65 C 10 52, -10 52, -25 65 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Main Astrolabe Body (Mater) -->
  <g transform="translate(400, 380)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="260" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="12" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="0" r="248" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>

    <!-- Degree Ticks on Rim -->
    <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-260" x2="0" y2="-248" />
      <line x1="0" y1="260" x2="0" y2="248" />
      <line x1="-260" y1="0" x2="-248" y2="0" />
      <line x1="260" y1="0" x2="248" y2="0" />
      <line x1="-183.8" y1="-183.8" x2="-175.3" y2="-175.3" />
      <line x1="183.8" y1="-183.8" x2="175.3" y2="-175.3" />
      <line x1="-183.8" y1="183.8" x2="-175.3" y2="175.3" />
      <line x1="183.8" y1="183.8" x2="175.3" y2="175.3" />
      <line x1="-99.5" y1="-239.7" x2="-94.9" y2="-228.6" />
      <line x1="99.5" y1="-239.7" x2="94.9" y2="-228.6" />
      <line x1="-239.7" y1="-99.5" x2="-228.6" y2="-94.9" />
      <line x1="239.7" y1="-99.5" x2="228.6" y2="-94.9" />
      <line x1="-99.5" y1="239.7" x2="-94.9" y2="228.6" />
      <line x1="99.5" y1="239.7" x2="94.9" y2="228.6" />
      <line x1="-239.7" y1="99.5" x2="-228.6" y2="94.9" />
      <line x1="239.7" y1="99.5" x2="228.6" y2="94.9" />
    </g>

    <!-- Inner Tympan Plate -->
    <circle cx="0" cy="0" r="240" fill="#090d16" stroke="#1e293b" stroke-width="4"/>

    <!-- Celestial Projection Lines -->
    <g stroke="#1e40af" stroke-width="1.5" fill="none" opacity="0.5">
      <circle cx="0" cy="40" r="180" />
      <circle cx="0" cy="80" r="130" />
      <circle cx="0" cy="110" r="80" />
      <circle cx="0" cy="130" r="40" />
      <path d="M -220 0 A 240 240 0 0 1 220 0" />
      <path d="M -200 -80 A 220 220 0 0 1 200 -80" />
      <path d="M -160 -150 A 200 200 0 0 1 160 -150" />
    </g>

    <!-- Ecliptic Ring (Rete) -->
    <circle cx="-25" cy="-25" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85" />
    <circle cx="-25" cy="-25" r="135" fill="none" stroke="url(#blueGlow)" stroke-width="1" stroke-dasharray="6 4" opacity="0.9" />

    <!-- Star Pointers -->
    <g fill="url(#goldGrad)">
      <path d="M -160 -40 L -140 -35 L -148 -20 Z" />
      <path d="M 110 -110 L 125 -95 L 105 -90 Z" />
      <path d="M -70 -160 L -55 -175 L -50 -155 Z" />
      <path d="M 80 100 L 95 115 L 75 120 Z" />
      <path d="M -130 90 L -115 100 L -110 80 Z" />
    </g>

    <!-- NTP Component -->
    <g transform="translate(0, -110)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5" filter="url(#subtleGlow)" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" />
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="12" y2="6" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#38ef7d" />
      <text x="0" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NTP</text>
    </g>

    <!-- DNS Component -->
    <g transform="translate(-105, 75)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38ef7d" stroke-width="2.5" filter="url(#subtleGlow)" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#38ef7d" stroke-width="1" opacity="0.8" />
      <ellipse cx="0" cy="0" rx="24" ry="10" fill="none" stroke="#38ef7d" stroke-width="1" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#38ef7d" stroke-width="1" />
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#38ef7d" stroke-width="1" />
      <path d="M 8 -8 L 16 -8 L 16 -16" fill="none" stroke="#f6d365" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="2" y1="-2" x2="16" y2="-16" stroke="#f6d365" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="44" fill="#38ef7d" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">DNS</text>
    </g>

    <!-- DHCP Component -->
    <g transform="translate(105, 75)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#f6d365" stroke-width="2.5" filter="url(#subtleGlow)" />
      <circle cx="0" cy="-10" r="5" fill="#f6d365" />
      <circle cx="-14" cy="10" r="4" fill="#38bdf8" />
      <circle cx="14" cy="10" r="4" fill="#38bdf8" />
      <line x1="0" y1="-10" x2="-14" y2="10" stroke="#f6d365" stroke-width="1.5" />
      <line x1="0" y1="-10" x2="14" y2="10" stroke="#f6d365" stroke-width="1.5" />
      <line x1="-14" y1="10" x2="14" y2="10" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
      <text x="0" y="44" fill="#f6d365" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">DHCP</text>
    </g>

    <!-- Service Connections -->
    <path d="M 0 -78 L -105 43 M 0 -78 L 105 43 M -73 75 L 73 75" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Pointer Arm (Alidade) -->
    <g transform="rotate(-28)">
      <path d="M -230 -12 L 230 -4 L 245 0 L 230 4 L -230 12 L -245 0 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
      <path d="M -220 -3 L 220 -1 L 220 1 L -220 3 Z" fill="#0f172a" opacity="0.7" />
      <rect x="-170" y="-18" width="8" height="36" rx="2" fill="url(#goldGrad)"/>
      <circle cx="-166" cy="-9" r="2.5" fill="#090d16" />
      <circle cx="-166" cy="9" r="2.5" fill="#090d16" />
      <rect x="162" y="-18" width="8" height="36" rx="2" fill="url(#goldGrad)"/>
      <circle cx="166" cy="-9" r="2.5" fill="#090d16" />
      <circle cx="166" cy="9" r="2.5" fill="#090d16" />
    </g>

    <!-- Center Axis -->
    <circle cx="0" cy="0" r="18" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="#00f2fe" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Project Branding -->
  <g transform="translate(400, 715)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
      ASTROLABE<tspan fill="#00f2fe">D</tspan>
    </text>
    
    <g transform="translate(0, 42)">
      <line x1="-260" y1="0" x2="260" y2="0" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#00f2fe" />

      <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="4">
        <tspan fill="#38ef7d">DNS FORWARDER</tspan>
        <tspan fill="#94a3b8"> | </tspan>
        <tspan fill="#f6d365">DHCP SERVER</tspan>
        <tspan fill="#94a3b8"> | </tspan>
        <tspan fill="#38bdf8">NTP SERVER</tspan>
      </text>
    </g>
  </g>
</svg>
