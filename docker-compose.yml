services:
  astrolabed-dns:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrolabed-dns-engine
    restart: unless-stopped

    # Bypasses Docker user-land proxy for minimal UDP latency
    # Note: When network_mode is host, ports section is ignored
    network_mode: host

    cap_add:
      - NET_BIND_SERVICE

    sysctls:
      - net.core.rmem_max=26214400
      - net.core.wmem_max=26214400
      - net.core.rmem_default=26214400
      - net.core.wmem_default=26214400

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    environment:
      - Logging__LogLevel__Default=Information
      - DnsEngine__ListenAddress__Address=0.0.0.0
      - DnsEngine__ListenAddress__Port=53
      - DnsEngine__ProcessingThreads=4

    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      - ./settings/:/etc/astrolabed:ro

    healthcheck:
      test: ["CMD-SHELL", "nc -z -u -w1 127.0.0.1 53 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
